[project]
name = "product-analytics-platform"
version = "1.0.0"
description = "End-to-end продуктовая аналитическая платформа (мини-Amplitude) на Python + DuckDB + Streamlit"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Fedor Bogomolov" }]
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "streamlit>=1.30",
    "plotly>=5.18",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "black>=24.0", "pre-commit>=3.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src", "src.generator", "src.pipeline", "src.metrics"]

# --------------------------------------------------------------------------- #
# Линтинг: ruff
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["data", "notebooks", ".venv"]

[tool.ruff.lint]
# E/F - pyflakes+pycodestyle, I - isort, UP - pyupgrade, B - bugbear,
# C4 - comprehensions, SIM - simplify, D - docstrings.
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
# E501 - длину строк контролирует black; C408 - dict(...) идиоматичен для Plotly.
ignore = ["E501", "C408"]

# --------------------------------------------------------------------------- #
# Форматирование: black
# --------------------------------------------------------------------------- #
[tool.black]
line-length = 100
target-version = ["py311"]
exclude = "(data|notebooks)"

# --------------------------------------------------------------------------- #
# Тесты: pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
